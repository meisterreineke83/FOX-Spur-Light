[tool]
# ID bleibt aus der Zeit als „komoonlight“ – eine neue ID wäre für LightOS/BrightMarket eine neue App
id = "de.meisterreineke.komoonlight"
label = "Spur"
versionCode = 15
versionName = "0.11.0"
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_FINE_LOCATION",
    "android.permission.VIBRATE",
]
capabilities = ["tool-manager-provider"]
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
